# Ruff configuration for the whole tree.
#
# Scope is deliberately narrow: correctness only. One pre-existing backlog is
# documented rather than enforced, so this config can gate everything else
# immediately instead of being a wall of ignores on day one:
#
#   * unused imports (F401) and duplicated imports. Enable F401 once swept.
#
# What is enforced is the class of bug that actually broke this repo, plus
# consistent formatting:
#
#   E9  syntax / runtime errors
#   F63 invalid comparison / print syntax
#   F7  syntax errors in statements (break/continue outside loop, ...)
#   F82 undefined names -- catches `from <deleted module> import x` and typos
#
# Formatting is enforced in CI with `ruff format --check`, so run
# `ruff format .` before pushing (or install the pre-commit hook).

line-length = 120

exclude = [
    ".git",
    "__pycache__",
    ".ipynb_checkpoints",
]

# What is out of scope for both lint and format, and why:
#
#   */old/**        superseded copies of scripts, kept for reference. Dead code,
#                   but still parsed by tools/check_syntax.py so a broken file
#                   cannot hide here.
#   *.ipynb         cell execution is stateful and out-of-order, which makes
#                   undefined-name rules noise rather than signal.
#   *.md            documentation. Reformatting the embedded Python samples
#                   churns READMEs without improving the code.
#   Replications/CLAP/**  vendored copy of the upstream audioset_tagging_cnn
#                   repository. Keep byte-close to upstream so it stays
#                   diffable; fixes belong upstream.
extend-exclude = [
    "**/old/**",
    "**/*.ipynb",
    "**/*.md",
    "Replications/CLAP/**",
]

[lint]
select = ["E9", "F63", "F7", "F82"]

[format]
# Leave quotes as written; the tree mixes single and double styles across
# generations of scripts and normalizing them adds diff noise for no gain.
quote-style = "preserve"
