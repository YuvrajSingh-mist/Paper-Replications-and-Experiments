# Ruff configuration for the whole tree.
#
# Scope is deliberately narrow: correctness only. One pre-existing backlog is
# documented rather than enforced, so this config can gate everything else
# immediately instead of being a wall of ignores on day one:
#
#   * ~319 unused imports (F401), plus 51 duplicated imports. Mostly in vendored
#     third-party code and in superseded `old/` copies. Enable F401 once swept.
#
# What is enforced is the class of bug that actually broke this repo:
#   E9  syntax / runtime errors
#   F63 invalid comparison / print syntax
#   F7  syntax errors in statements (break/continue outside loop, ...)
#   F82 undefined names -- catches `from <deleted module> import x` and typos

line-length = 120

exclude = [
    ".git",
    "__pycache__",
    ".ipynb_checkpoints",
]

# Superseded copies under `*/old/` are excluded from linting: they are dead code
# that still gets syntax-checked by tools/check_syntax.py. Notebooks are
# excluded because cell execution is stateful and out-of-order by nature, which
# makes undefined-name rules noise rather than signal.
extend-exclude = [
    "**/old/**",
    "**/*.ipynb",
]

[lint]
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# Vendored upstream code: CLAP's audioset_tagging_cnn is a copy of the original
# repository, including its `from models import *` and a stray debug line. Fixes
# belong upstream.
"Replications/CLAP/**" = ["F82"]
