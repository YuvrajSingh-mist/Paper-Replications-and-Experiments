[project]
name = "math-posttrain"
version = "0.1.0"
description = "Math post-training on Mac Minis: TRL SFT, TRL GRPO + vllm-metal, LightEval."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Singh" }]
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "accelerate>=1.0.0",
    "trl>=0.22",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "lighteval[accelerate]>=0.13.0",
    # xxhash 4.x requires bytes; LightEval 0.13 still hashes str queries
    "xxhash>=3.4,<4",
    "langdetect>=1.0.9",
    "word2number>=1.1",
]

[project.scripts]
math-sft = "sft.train:main"
math-grpo = "grpo.train:main"
math-eval = "math_eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grpo", "src/sft", "src/math_eval"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
package = true
