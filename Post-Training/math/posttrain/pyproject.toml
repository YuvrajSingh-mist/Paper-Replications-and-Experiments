[project]
name = "posttrain"
version = "0.1.0"
description = "Branch-per-experiment post-training template: TRL SFT, GRPO + vllm-metal, lm-eval."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Singh" }]
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "accelerate>=1.0.0",
    "trl>=0.22",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "lm-eval[hf]>=0.4.13",
    "immutabledict>=4.0",
    "nltk>=3.8",
    "langdetect>=1.0.9",  # ifeval
]

[project.scripts]
# Generic entrypoints — experiment = git branch + configs/*.yaml model fields
sft = "sft.train:main"
grpo = "grpo.train:main"
eval = "eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grpo", "src/sft", "src/eval"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
package = true
