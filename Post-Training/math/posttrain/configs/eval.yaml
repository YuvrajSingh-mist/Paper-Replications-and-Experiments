# lm-eval defaults for ./scripts/evals.sh (model path, suite, MPS-safe batch).
# Experiment identity = git branch; override model on the CLI anytime.

model: HuggingFaceTB/SmolLM-360M-Instruct
output_path: outputs/lm_eval

# instruct (default) | math (gsm8k only)
suite: instruct

# null → use suite file under src/eval/suites/
tasks: null

# Same batch for MC + generative (split script also forces this).
batch_size: 8
# null → each task's lm-eval default (gsm8k=5). Split script passes --num-fewshot 1 for gsm8k.
num_fewshot: null
max_gen_toks: 256
max_samples: null            # set e.g. 8 for a smoke eval
device: null                 # null → auto (mps/cuda/cpu)
dtype: null                  # null → float16 on MPS, bfloat16 on CUDA
apply_chat_template: true    # instruct models
# Default off — split script enables --log_samples only for ifeval+gsm8k.
log_samples: false
